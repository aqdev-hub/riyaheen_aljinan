name: riyaheen_aljinan
description: رياحين الجنان - منصة إسلامية متكاملة
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # State Management
  # ✅ تمت إضافة flutter_riverpod بناءً على طلبك الصريح لتحويل قسم القرآن
  # إليه (بقية الأقسام غير المرتبطة بهذه الدفعة ما زالت لا تستخدم أي
  # إدارة حالة، فهي شاشات "قيد الإنشاء" ثابتة)
  # ملاحظة: أزلنا اعتماد provider لأن لا شيء في المشروع يستخدمه بعد الآن
  # (كان مقتصرًا على QuranSettingsProvider القديم الذي انتقل إلى Riverpod)
  flutter_riverpod: ^2.6.1

  # مشاركة نص الآية ومشاركة صورة الصفحة (مشاركة حقيقية عبر نظام التشغيل)
  # ✅ يجب أن يكون >= 11 لأن SharePlus.instance و ShareParams لا يوجدان في 10.x
  # (استخدمنا ^11.1.0 عمدًا لا 12+ لتفادي تغييرات Android compile SDK في 12)
  share_plus: ^11.1.0

  # Local Storage
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Audio
  just_audio: ^0.9.40
  audio_session: ^0.1.21

  # Permissions
  permission_handler: ^11.3.1

  # UI
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # لتوليد أيقونة التطبيق لكل المنصات من صورة واحدة تضعها أنت
  flutter_launcher_icons: ^0.14.3

# الأيقونة جاهزة في assets/images (app_icon.png للأيقونة الكاملة،
# app_icon_foreground.png لطبقة أندرويد التكيفية الشفافة). لتوليد كل
# الأحجام لأندرويد وiOS نفّذ مرة واحدة: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#14501B"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/audio/
    - assets/data/
    - assets/data/quran/

  fonts:
    - family: Uthmanic
      fonts:
        - asset: assets/fonts/UthmanicHafs.ttf

    - family: Scheherazade
      fonts:
        - asset: assets/fonts/ScheherazadeNew-Regular.ttf
        - asset: assets/fonts/ScheherazadeNew-Bold.ttf
          weight: 700
